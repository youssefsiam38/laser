# Packaging (M5-T5). Every non-obvious line has a reason; see README.md.
#
# GENERATED from electron-builder.yml.tpl by `pnpm identity:generate`.
# Every name in this file comes from product.json (MX-T7, D-36). Editing the
# generated copy is caught by `pnpm identity:check`, which runs inside
# `pnpm -r build` and `pnpm -r test`; edit the template instead.
#
# The three rules this file encodes:
#   1. Nothing that must be *executed* may live inside app.asar. An asar is an
#      archive, not a filesystem: the kernel cannot exec a path inside it, and a
#      spawned process cannot use it as a working directory. So the bundled Node
#      is an extraResource and the whole dependency tree is unpacked.
#   2. The app id may change exactly once — before anyone installs a build.
#      It keys macOS TCC grants (the microphone permission), the Windows
#      notification centre, and the update feed's identity, so changing it
#      after distribution makes this a different application: the microphone
#      permission is lost and the installed copy is orphaned rather than
#      upgraded. D-36 says the product may still be renamed, which is why the
#      value below is derived from product.json and why the rename has to
#      happen before the first public artifact, not after.
#   3. The bundled Node is signed with the app. An unsigned Mach-O inside a
#      hardened-runtime bundle fails notarization, and on Windows an unsigned
#      helper is what SmartScreen complains about.

appId: com.hubtrix.laser
productName: Laser
copyright: Copyright © Laser contributors

directories:
  output: out
  buildResources: build

# Resolves runtime/<platform>-<arch>/node into build/runtime/, downloading it
# if it is missing. See build/before-pack.cjs.
beforePack: build/before-pack.cjs

files:
  - dist/**/*
  - package.json
  - "!**/*.map"
  # Only a package's OWN top-level test and doc directories. The unanchored form
  # (`node_modules/**/{…}`) also deletes source directories that merely happen to
  # be called `doc`: `yaml/dist/doc/` is one, and without it the agent throws
  # ERR_MODULE_NOT_FOUND on the first import and the packaged app cannot open a
  # session at all. `*` is an unscoped package, `@*/*` a scoped one.
  # `scripts/clean-machine.mjs` catches this class; do not widen it again.
  - "!**/node_modules/*/{test,tests,__tests__,example,examples,docs,doc}/**"
  - "!**/node_modules/@*/*/{test,tests,__tests__,example,examples,docs,doc}/**"
  # Do not strip TypeScript from dependencies. Engine extensions may ship as
  # executable source packages: a bundled feature can export index.ts and
  # import its implementation from src/**/*.ts, and the engine's resource
  # loader transpiles that source at runtime. Removing it produces an
  # installer that launches but cannot open any session with that feature
  # enabled. Read a package's `exports`, `files` and engine manifest before
  # excluding a file type from it (AGENTS.md §5a).
  - "!**/node_modules/**/*.{md,markdown,map,flow}"
  # MCP skills are executable instructions, not disposable package docs.
  # Its TypeScript, JS bridge, CJS keyring helper, MJS worker and native
  # prebuilds are preserved by the rules above. conformance/, examples/,
  # __tests__/ and *.test.ts are not in the adapter's published `files`.
  - "**/node_modules/pi-mcp-adapter/skills/**"
  # Prebuilt native audio bindings for every platform, ~28 MB, reachable from
  # exactly one function: pi-gpt-transcribe's openMic. Nothing here opens a
  # microphone — the browser does the capture and the worker only makes the
  # request — so this is weight with no code path to it. It is an optional
  # dependency of that package precisely so a consumer can leave it out.
  - "!**/node_modules/{decibri,@decibri}/**"

  # ------------------------------------------------ M16-T33: only what runs ----
  #
  # Everything below was proved unreachable by reading the loader that would
  # have to reach it, and each rule says which one. The measurements and the
  # before/after inventory are in docs/perf-package.md. The gate for all of
  # them is the same: `scripts/clean-machine.mjs` against a real packaged
  # session, with an empty PATH. Nothing here removes a file type by
  # extension, and nothing here touches an engine or provider package's
  # executable source (AGENTS.md §5a).

  # This workspace's own packages ship built output and their TypeScript
  # sources side by side, because they are linked, not published. Every one of
  # them resolves through `exports`/`main`/`bin` into `dist/`, and nothing
  # reads a sibling `src/`: the host serves `@lasercode/ui/dist` (it resolves
  # the package manifest and then requires `dist/index.html` to exist —
  # `defaultUiDir` in packages/host/src/server.ts), the worker imports
  # `@lasercode/pi-extension` as a normal module, so the engine loads the
  # extension's `dist`, never its source. `*.map` is already excluded above,
  # so the sources cannot even serve a debugger. `public/` is vite's input,
  # copied into `dist/` at build time; the root `index.html` is vite's
  # template, and `dist/index.html` is the one that is served.
  - "!**/node_modules/@lasercode/*/{src,public}/**"
  - "!**/node_modules/@lasercode/*/{tsconfig*.json,*.tsbuildinfo,vite.config.ts,vitest.config.ts,components.json,index.html}"

  # A 22 MB JVM archive that is the *second* choice of a checker used for one
  # thing: pi-mcp-adapter's ReDoS guard on a person's regex search over MCP
  # tools, through `checkSync` (proxy-modes.ts:741, params at :32). Read the
  # loader (recheck/lib/main.js): `checkSync` runs the analysis either in a
  # synckit worker (the default) or, with RECHECK_SYNC_BACKEND=pure, in the
  # pure-JS engine that is compiled into lib/main.js itself. The worker takes
  # the `auto` path, which tries the native `recheck-<os>-<arch>` binary, then
  # `java -jar` this archive, and falls back to that same pure engine when
  # neither answers. The jar's path comes from
  # `require.resolve("recheck-jar/package.json")`, which the loader wraps in a
  # try/catch that returns null on MODULE_NOT_FOUND — so removing the package
  # is a fallthrough, not a crash.
  #
  # The jar can therefore only ever be chosen where there is no native binary
  # AND the machine has a JVM. recheck 4.5.0's optionalDependencies publish a
  # binary for linux-x64, macos-x64, macos-arm64 and windows-x64 only — so on
  # our two arm64 targets (Linux and Windows) there is no native binary and the
  # pure engine is already what most people get, because most machines have no
  # `java`. The pure engine gives the same answers: `checkSync` with the
  # adapter's own parameters returns vulnerable for `^(a|a)*$`, vulnerable for
  # `get_.*_tool` and safe for `^[a-z]+(foo|bar)?$` under both backends, in
  # milliseconds — well inside the adapter's 250 ms analysis budget. The
  # numbers are in docs/perf-package.md, and `scripts/clean-machine.mjs` runs
  # that comparison on every packaged build, so a change that leaves the guard
  # unable to answer (which would reject every regex search) fails the gate.
  # Never make this a reason to drop the native binary too: that one is the
  # first choice and stays.
  - "!**/node_modules/recheck-jar/**"
  # The same package's browser bundle, a second copy of the engine reached only
  # through the `browser` field, which Node's resolver does not implement and
  # no bundler runs here.
  - "!**/node_modules/recheck/lib/browser.js"

  # Published TypeScript sources whose package `exports` do not map them, so
  # Node refuses them: `require.resolve("zod/src/index.ts")` inside the
  # packaged tree throws ERR_PACKAGE_PATH_NOT_EXPORTED, and so do the other
  # two. zod lists `./src/*.ts` only under its opt-in `@zod/source` condition,
  # which nothing in the package sets; the SDKs publish `files: ["**/*"]` and
  # build to sibling directories, and none of their shipped JavaScript
  # references `../src/`. With `*.map` already gone they are not even a
  # debugging aid. These are sources beside built output, not the executable
  # source packages §5a is about — those export their `.ts` entry point.
  - "!**/node_modules/zod/src/**"
  - "!**/node_modules/{openai,@anthropic-ai/sdk}/src/**"

  # highlight.js's CSS themes and their SCSS sources: ~2 MB of stylesheets for
  # a browser. Nothing in the package imports them — the only importer of
  # highlight.js here is the engine, and it requires `highlight.js/lib/…`
  # (core plus one file per language) — and no Node process can execute a
  # stylesheet. The UI's own styling is compiled into `@lasercode/ui/dist`.
  - "!**/node_modules/highlight.js/{styles,scss}/**"

  # handlebars's AMD and browser bundles. `require("handlebars")` resolves to
  # lib/index.js, which requires `../dist/cjs/handlebars` — that directory
  # stays. `dist/amd/**` and the concatenated `dist/handlebars*.js` are the
  # script-tag and RequireJS builds of the same code; nothing in the tree
  # names them.
  - "!**/node_modules/handlebars/dist/amd/**"
  - "!**/node_modules/handlebars/dist/*.js"

  # A 1 MB Yarn plugin release that was published inside the package by
  # accident. domino's `main` is `./lib`; `.yarn/` is that project's own
  # package-manager cache.
  - "!**/node_modules/@mixmark-io/domino/.yarn/**"

  # 6.1 MB of README artwork in one extension: a demo video and a banner
  # image. They appear nowhere but their own package's `files` list (the npm
  # publish manifest) and, for the video, a `pi.video` field that is a
  # github.com URL, not this copy. The package's engine entry point is
  # `pi.extensions: ["./index.ts"]`, which is executable source and stays; no
  # code in the tree names the artwork, the README that embedded it is already
  # excluded with the other Markdown, and neither the engine nor anything here
  # reads an image out of a dependency. Named file by file on purpose: an
  # extension may legitimately ship an image it serves, so this must never
  # become an exclusion by file type.
  #
  # pi-mcp-adapter's own 1.1 MB banner is deliberately NOT excluded. That
  # package's published `files` list is a contract the packaged gate already
  # enforces — `scripts/check-mcp-artifact.mjs` requires every non-Markdown
  # entry of it to exist, because that is how lazily loaded OAuth and
  # script-mode assets are protected — and a megabyte is not worth teaching a
  # gate to make exceptions.
  - "!**/node_modules/pi-web-access/{banner.png,pi-web-fetch-demo.mp4}"

  # A minifier that only a command-line tool can reach. handlebars declares
  # uglify-js as an *optional* dependency and requires it from one file,
  # `lib/precompiler.js` (and its `dist/cjs` twin) — the implementation behind
  # `bin/handlebars --min`. That file calls `require.resolve('uglify-js')`
  # first and, on MODULE_NOT_FOUND, prints "Code minimization is disabled due
  # to missing uglify-js dependency" and carries on. The only importer of
  # handlebars in this tree is @lasercode/protocol's instruction templates,
  # which call `Handlebars.compile` through `lib/index.js`; nothing here runs
  # the CLI, and no other file in the packaged tree names uglify-js.
  - "!**/node_modules/uglify-js/**"

  # The Google SDK's browser build and its condition-neutral bundle. Its
  # `exports` for "." lists "browser" first, then "node", then a bare default;
  # Node never sets "browser", so the specifier always lands in dist/node/.
  # Proved in the packaged tree with the bundled Node and an empty PATH, from
  # the file that actually imports it
  # (@earendil-works/pi-ai/dist/api/google-generative-ai.js):
  # `require.resolve` gives dist/node/index.cjs and `import.meta.resolve`
  # gives dist/node/index.mjs, for both `@google/genai` and
  # `@google/genai/node` — the only two specifiers any file here uses.
  # dist/index.* and dist/web/** are the bundler-facing copies of that same
  # SDK; dist/node, dist/tokenizer and dist/vertex_internal stay.
  - "!**/node_modules/@google/genai/dist/{index.mjs,index.cjs}"
  - "!**/node_modules/@google/genai/dist/web/**"

  # Fourteen of the fifteen builds of a streams polyfill this runtime never
  # needs. The package has no `exports`, so the proof is its importers: one
  # file in the whole packaged tree names it — fetch-blob/streams.cjs requires
  # `web-streams-polyfill/dist/ponyfill.es2018.js`, and only inside
  # `if (!globalThis.ReadableStream)`, which is false on every Node we ship.
  # Nothing imports the package root, so `main` is unreachable too. That one
  # required file stays; the globals-patching `polyfill.*` builds, the es6 and
  # unsuffixed ponyfills and the minified copies have no requirer.
  - "!**/node_modules/web-streams-polyfill/dist/polyfill*"
  - "!**/node_modules/web-streams-polyfill/dist/ponyfill.{js,mjs,es6.js,es6.mjs,es2018.mjs}"

extraResources:
  # Offline stdio server used by the real packaged-session acceptance gate.
  - from: scripts/fixtures/packaged-mcp-server.mjs
    to: checks/mcp-server.mjs
  # The stock Node the host is spawned from (M5-T2).
  - from: build/runtime
    to: runtime
  # The binary distribution must carry the complete AGPL terms and the exact
  # scope/dual-license/trademark notices beside the executable resources.
  - from: ../../LICENSE
    to: legal/LICENSE
  - from: ../../LICENSING.md
    to: legal/LICENSING.md
  - from: ../../COMMERCIAL.md
    to: legal/COMMERCIAL.md
  - from: ../../TRADEMARKS.md
    to: legal/TRADEMARKS.md

asar: true
asarUnpack:
  # The host, the worker, the CLI, Pi and everything they load run in the
  # bundled Node — a separate process that knows nothing about asar. All of it
  # has to be real files on disk.
  - node_modules/**/*

# @napi-rs/keyring ships prebuilt N-API binaries, and N-API is ABI-stable
# across Electron and Node, so there is nothing to rebuild. Rebuilding would
# only introduce a toolchain requirement on every build agent.
npmRebuild: false
buildDependenciesFromSource: false

protocols:
  - name: Laser
    schemes: [lasercode]

# ---------------------------------------------------------------- macOS ----
mac:
  category: public.app-category.developer-tools
  darkModeSupport: true
  # dmg is what people download; zip is what electron-updater needs to apply
  # a delta, so both are published.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signed as well as the app itself: an unsigned Mach-O anywhere in a hardened
  # bundle is a notarization failure.
  binaries:
    - Contents/Resources/runtime/node
  # electron-builder >= 26 notarizes with the notarytool credentials in the
  # environment (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID, or
  # APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER).
  notarize: true
  extendInfo:
    # Without this key macOS kills the process the moment it touches the
    # microphone — it is not a prompt string, it is the permission itself.
    NSMicrophoneUsageDescription: "Laser uses the microphone only while you are dictating a
      message to an agent. Nothing is recorded or sent anywhere unless you start dictation."
    # The app reads the directories you add as projects; macOS asks about the
    # protected ones by name.
    NSDesktopFolderUsageDescription: "Laser needs access to open a project you keep on your Desktop."
    NSDocumentsFolderUsageDescription: "Laser needs access to open a project you keep in Documents."
    NSDownloadsFolderUsageDescription: "Laser needs access to open a project you keep in Downloads."
    # The window draws its own titlebar; this keeps the system chrome dark when
    # the app is dark.
    NSRequiresAquaSystemAppearance: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# -------------------------------------------------------------- Windows ----
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  # Azure Trusted Signing (formerly Azure Code Signing) is configured in
  # `build/before-pack.cjs`, from the environment, and only when all four
  # values are present. It is deliberately NOT written here: electron-builder
  # treats the presence of `azureSignOptions` as "sign with Azure" and fails
  # the build when the endpoint does not resolve, so a committed placeholder
  # turns a missing credential into a broken `--win` target rather than an
  # unsigned installer.
  #
  # To sign, export all four before `pnpm -F @lasercode/desktop dist -- --win`:
  #   LASERCODE_AZURE_PUBLISHER_NAME    the CN in the certificate profile
  #   LASERCODE_AZURE_ENDPOINT          https://<region>.codesigning.azure.net
  #   LASERCODE_AZURE_ACCOUNT           the code-signing account name
  #   LASERCODE_AZURE_PROFILE           the certificate profile name
  # plus the credentials electron-builder reads itself: AZURE_TENANT_ID,
  # AZURE_CLIENT_ID, AZURE_CLIENT_SECRET.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Laser
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

# ---------------------------------------------------------------- Linux ----
#
# Four formats, two architectures, and one rule behind all of them: the app is
# self-contained, so a person installs it and nothing else. That makes the
# packaging the product's first impression, and the differences
# between the formats are differences in what the host machine has to provide.
#
#   AppImage   one file, no install, no root. Runs on any distribution.
#   deb / rpm  a real system package: menu entry, lasercode:// handler, icon
#              cache, AppArmor profile, and a sandbox helper set up as root.
#   tar.gz     everything, unpacked wherever you like, with a laser-setup.sh
#              that wires up the menu entry per-user — the offline path, for a
#              machine that cannot reach GitHub. Named so rather than
#              `install.sh`, because the repository root already has one of
#              those and it also installs the tarball; two files with one name
#              in one product is a coin flip for whoever finds one. Built by
#              scripts/pack-tarball.mjs, not by electron-builder, because a
#              tarball also has to carry usr/share/{applications,icons,metainfo}
#              and a way to register them.
#
# `pnpm -F @lasercode/desktop dist:linux` builds all of them and prints the
# artifact table. `electron-builder --linux` still works and builds the three
# formats below.

# Root-level keys, written here because everything they change is Linux.

# build/after-pack.cjs renames Electron's executable to `laser-bin` and puts
# a POSIX shell launcher at `laser`, so the application menu, the
# /usr/bin entry, a double-clicked AppImage and the tarball's own copy all run
# the same code. That code makes one decision — which sandbox this kernel can offer — and
# it never disables the sandbox on the person's behalf.
afterPack: build/after-pack.cjs

toolsets:
  # THE REASON THE APPIMAGE NEEDS NO ROOT AND NO LIBFUSE2.
  #
  # electron-builder's default AppImage runtime ("0.0.0") is the 2018 type-2
  # runtime, which mounts itself with FUSE 2. Debian 12, Ubuntu 22.04 and later,
  # and Fedora ship FUSE 3 and no libfuse2, so that runtime prints
  # "dlopen(): error loading libfuse.so.2" and stops — and the usual answer,
  # `sudo apt install libfuse2`, is a terminal and a root password we promised
  # nobody would need.
  #
  # "1.0.3" is the current statically linked runtime: it links libfuse3 itself,
  # and where FUSE is unavailable entirely (a container, a hardened kernel) it
  # extracts itself to a temporary directory and runs from there. Nothing to
  # install, nothing to elevate.
  appimage: "1.0.3"

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]

  # The binary, the icon name and the .desktop basename, all one value from
  # product.json. build/after-pack.cjs and build/linux/apparmor.tpl read the
  # same file, so `laser-bin` is never spelled twice.
  executableName: laser

  # product.json's copy.summary, the same words the AppStream metainfo and the
  # tarball's .desktop entry use. scripts/make-linux-assets.mjs fails the build
  # if this generated copy is edited in place and drifts.
  synopsis: "A control room for coding agents"
  # One sentence on purpose: electron-builder always writes the .desktop
  # entry's `Comment` from this and ignores an override, and `Comment` is what
  # GNOME prints under the name in search results. The longer text lives in the
  # AppStream metainfo, which is the only surface with room for it.
  description: "Runs coding agent sessions across every project on this machine through one desktop interface."

  # Becomes `Categories=Development;IDE;`. `IDE` is a registered additional
  # category under `Development`, and it is where a desktop menu files the kind
  # of thing this is.
  category: Development;IDE

  # fpm refuses to build a package without a maintainer, and it is right to:
  # `apt show` and `rpm -qi` both print this line.
  maintainer: Laser contributors <youssefsiam38@gmail.com>
  vendor: Laser

  # build/icons/{16,32,48,64,128,256,512}x*.png, written by scripts/make-icons.mjs.
  # Every size is a real render of the mark rather than one image scaled down,
  # so the 16px tray-sized icon is legible instead of mush.
  icon: build/icons

  # Install the entry as `laser.desktop`, matching `desktopName` in
  # package.json and therefore Electron's own Wayland app_id and X11 WM_CLASS.
  # Without this the compositor cannot tell that the running window belongs to
  # the menu entry, and the taskbar shows a generic icon with no name.
  syncDesktopName: true

  desktop:
    entry:
      # Exec, Icon, Name, Comment, Categories, StartupWMClass and MimeType are
      # all computed by electron-builder — MimeType from the `protocols` block
      # above, which is what registers lasercode:// with the desktop. Setting
      # them here would be silently overwritten. What is left is what nothing
      # else supplies:
      StartupNotify: "true"
      # What someone types into GNOME's overview or KDE's launcher when they
      # cannot remember the name.
      Keywords: agent;ai;assistant;coding;developer;automation;llm;chat;
      # The app posts notifications when an agent needs an answer; GNOME uses
      # this to offer per-app notification settings.
      X-GNOME-UsesNotifications: "true"

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

# ------------------------------------------------- deb and rpm: depends ----
#
# Declared rather than guessed. electron-builder's defaults are a reasonable
# list for Electron in general and wrong for this one in two directions: they
# ask for libxss1 and libxtst6, which Electron 44 no longer links or dlopens,
# and they omit libsecret, which it does dlopen and which the app needs for the
# keychain.
#
# The list is every DT_NEEDED entry of the shipped `electron` and `node`
# binaries, mapped to the package that owns the library, plus the three
# libraries Electron opens by name at runtime (libsecret-1.so.0 for the
# keychain, libnotify.so.4 for notifications, libpulse for audio) and
# xdg-utils, which is how the app opens a provider's sign-in page in the
# browser. Transitive dependencies are left to the package manager.
#
# The names are the pre-t64 ones on purpose: Ubuntu 24.04's libfoo-t64
# packages all `Provides:` the classic name, so this list resolves on Debian
# 12, Ubuntu 22.04 and Ubuntu 24.04 alike, while `libgtk-3-0t64` would resolve
# on none of them but the newest.
deb:
  # Two things fpm will not do from its own options.
  #
  #   * The AppStream metainfo at the system path. /opt is not somewhere GNOME
  #     Software or KDE Discover look, so the copy build/after-pack.cjs places
  #     inside the app (for the AppImage's AppDir) does not count here.
  #   * The licence field. There is no LICENSE file in the repository and no
  #     `license` in package.json, so fpm writes "unknown"; the truth is that
  #     the work is not licensed for redistribution, and saying so is better
  #     than leaving a blank for someone to fill in with a guess.
  #
  # Order matters: fpm's option parser stops reading options at the first
  # positional argument, so every flag has to come before the source=destination
  # pair or it is silently taken as another path to package.
  #
  # The path is relative because electron-builder.yml cannot compute an absolute
  # one. build/after-pack.cjs checks that it resolves before any target is
  # built, and says what to do if it does not.
  fpm:
    - --license
    - Proprietary
    - build/linux/generated/com.hubtrix.laser.metainfo.xml=/usr/share/metainfo/com.hubtrix.laser.metainfo.xml
    - build/linux/package-repository-key.asc=/usr/share/keyrings/laser-archive-keyring.asc
  # electron-builder's default pattern is `${name}_${version}_${arch}`, and
  # `${name}` is this package's npm name — a scoped one — which fpm then
  # reads as a directory that does not exist. The file is named after the
  # program, the way `apt` and `dnf` name it in their own listings, and after
  # the architecture the way that format spells it: amd64 for Debian,
  # x86_64 for RPM and the AppImage, matching `uname -m` where it can.
  artifactName: laser_${version}_${arch}.${ext}

  # Written by us rather than left to electron-builder's defaults, so that the
  # install registers the lasercode:// handler and refreshes the icon and desktop
  # caches, and the removal undoes exactly that and nothing more. fpm maps them
  # onto postinst/%post and postrm/%postun, and both of those also run in the
  # middle of an *upgrade* — the scripts handle that.
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
  # Ubuntu 23.10 and later will not give an unconfined program its own user
  # namespace, and a user namespace is what Chromium's sandbox is made of.
  appArmorProfile: build/linux/apparmor.tpl
  depends:
    - libasound2
    - libatk-bridge2.0-0
    - libatk1.0-0
    - libatspi2.0-0
    - libcairo2
    - libcups2
    - libdbus-1-3
    - libexpat1
    - libgbm1
    - libgcc-s1
    - libglib2.0-0
    - libgtk-3-0
    - libnotify4
    - libnspr4
    - libnss3
    - libpango-1.0-0
    - libsecret-1-0
    - libstdc++6
    - libudev1
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
    - xdg-utils
  recommends:
    # The tools the post-install script uses to register the menu entry and the
    # lasercode:// handler. Present on every desktop install; the scripts check
    # for each one before calling it, so a server install still succeeds.
    - desktop-file-utils
    - shared-mime-info
    # libsecret talks to a secret-service daemon over D-Bus. Without one the
    # app still runs and says its device key is stored unencrypted instead.
    - gnome-keyring | kwalletmanager
    # Audio for dictation. Electron falls back to ALSA without it.
    - libpulse0
  packageCategory: devel
  priority: optional

rpm:
  # Two things fpm will not do from its own options.
  #
  #   * The AppStream metainfo at the system path. /opt is not somewhere GNOME
  #     Software or KDE Discover look, so the copy build/after-pack.cjs places
  #     inside the app (for the AppImage's AppDir) does not count here.
  #   * The licence field. There is no LICENSE file in the repository and no
  #     `license` in package.json, so fpm writes "unknown"; the truth is that
  #     the work is not licensed for redistribution, and saying so is better
  #     than leaving a blank for someone to fill in with a guess.
  #
  # Order matters: fpm's option parser stops reading options at the first
  # positional argument, so every flag has to come before the source=destination
  # pair or it is silently taken as another path to package.
  #
  # The path is relative because electron-builder.yml cannot compute an absolute
  # one. build/after-pack.cjs checks that it resolves before any target is
  # built, and says what to do if it does not.
  fpm:
    - --license
    - Proprietary
    - build/linux/generated/com.hubtrix.laser.metainfo.xml=/usr/share/metainfo/com.hubtrix.laser.metainfo.xml
    - build/linux/package-repository-key.asc=/etc/pki/rpm-gpg/RPM-GPG-KEY-laser
  artifactName: laser-${version}.${arch}.${ext}

  # Written by us rather than left to electron-builder's defaults, so that the
  # install registers the lasercode:// handler and refreshes the icon and desktop
  # caches, and the removal undoes exactly that and nothing more. fpm maps them
  # onto postinst/%post and postrm/%postun, and both of those also run in the
  # middle of an *upgrade* — the scripts handle that.
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
  # Ubuntu 23.10 and later will not give an unconfined program its own user
  # namespace, and a user namespace is what Chromium's sandbox is made of.
  appArmorProfile: build/linux/apparmor.tpl
  # Fedora, openSUSE and RHEL name the same libraries differently, and one or
  # two of them differently again between releases — hence the boolean
  # dependencies, which rpm has understood since 4.13.
  depends:
    - alsa-lib
    - at-spi2-atk
    - at-spi2-core
    - atk
    - cairo
    - cups-libs
    - dbus-libs
    - expat
    - glib2
    - gtk3
    - libX11
    - libXcomposite
    - libXdamage
    - libXext
    - libXfixes
    - libXrandr
    - libgcc
    - libnotify
    - libsecret
    - libstdc++
    - libxcb
    - libxkbcommon
    - mesa-libgbm
    - nspr
    - nss
    - pango
    - "(systemd-libs or libudev1)"
    - xdg-utils

# --------------------------------------------------------------- Updates ----
# Deliberately unset, and the app says so: `Updater` reports `unsupported`
# ("this build has no update feed") rather than an error, because a check that
# structurally cannot succeed must not be reported as a check that failed.
#
# It was `provider: github, owner: youssefsiam38, repo: laser`, which does
# not work: that repository is private, and electron-updater fetches
# `…/releases/download/<tag>/latest.yml` unauthenticated, so every installed
# copy would get a 404 forever. The only supported alternative for a private
# repo is `private: true` plus a token baked into `app-update.yml` inside the
# shipped app, which is a credential in an artifact and a non-starter.
#
# Two ways to turn updates on, either of which makes the feed public:
#
#   1. A public releases repository (the usual split when the source stays
#      private):
#        publish:
#          provider: github
#          owner: youssefsiam38
#          repo: laser-releases
#          releaseType: release
#
#   2. Any public feed URL:
#        publish:
#          provider: generic
#          url: https://downloads.example.com/laser/${channel}
#
# Until one of those is true, README.md's "publish version A, install it,
# publish version B" cannot pass, and the app is honest about why. `null` is
# explicit rather than absent so electron-builder does not infer a GitHub feed
# from a `repository` field somebody adds to package.json later.
publish: null
