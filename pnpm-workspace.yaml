packages:
  - "packages/*"

# Workaround for an upstream packaging bug in @earendil-works/pi-coding-agent 0.85.0:
# `dist/main.js` -> `dist/experimental/server.js` imports `@earendil-works/pi-server`,
# but the package does not declare it. It only resolves under npm's flat hoisting, so a
# strict installer (pnpm, yarn PnP) fails at import time with ERR_MODULE_NOT_FOUND.
# Tracked in docs/upstream.md. Remove this block once upstream declares the dependency.
packageExtensions:
  "@earendil-works/pi-coding-agent":
    dependencies:
      "@earendil-works/pi-server": "0.85.0"
patchedDependencies:
  '@assistant-ui/core@0.3.17': patches/@assistant-ui__core@0.3.17.patch
  '@narumitw/pi-goal@0.54.4': patches/@narumitw__pi-goal@0.54.4.patch
  pi-web-access@0.28.0: patches/pi-web-access@0.28.0.patch
